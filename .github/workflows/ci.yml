name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · lint · format · test · audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: audit (the registry's audit endpoint is flaky; three attempts, a real finding fails all three)
        run: |
          for attempt in 1 2 3; do
            if npm run audit; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then echo "audit attempt $attempt failed, retrying in 30s"; sleep 30; fi
          done
          exit 1
      - name: commitlint (PR title, which squash-merge lands on main)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

  engine-db:
    name: engine · migrations on TimescaleDB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: wick
          POSTGRES_USER: wick
          POSTGRES_PASSWORD: wick
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wick -d wick"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm -w @wick/engine run migrate
        env:
          DATABASE_URL: postgres://wick:wick@127.0.0.1:5432/wick
      - run: npm -w @wick/engine test
        env:
          TEST_DATABASE_URL: postgres://wick:wick@127.0.0.1:5432/wick
      - name: compose file renders
        run: docker compose -f apps/engine/deploy/docker-compose.yml config -q
        env:
          POSTGRES_PASSWORD: x
          TELEGRAM_BOT_TOKEN: t
          TELEGRAM_CHAT_ID: "1"
          GRAFANA_PASSWORD: g
          TAILSCALE_IP: 100.64.0.1
          DASHBOARD_TOKEN: d

  build-and-smoke:
    name: build · render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
        env:
          NITRO_PRESET: node-server
      - run: npx playwright install --with-deps chromium
      - name: serve the built output and smoke it
        run: |
          node apps/desk/.output/server/index.mjs > server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          npm run smoke -- http://127.0.0.1:3000/ screenshots
        env:
          PORT: 3000
      - name: build the console in mock mode and smoke it
        run: |
          npm run build -w @wick/console
          (cd apps/console && npx vite preview --port 8091 --host 127.0.0.1 > ../../console.log 2>&1 &)
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8091/ && break
            sleep 1
          done
          npm run smoke -- http://127.0.0.1:8091/ screenshots/console
        env:
          VITE_MOCK: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: screenshots/**/*.png
          if-no-files-found: ignore
