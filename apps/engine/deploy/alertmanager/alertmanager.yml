# Rendered at container start: the two placeholders are replaced from .env.
global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: [alertname]
  group_wait: 20s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: telegram
      repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "__TELEGRAM_BOT_TOKEN__"
        chat_id: __TELEGRAM_CHAT_ID__
        parse_mode: ""
        message: |-
          {{ range .Alerts }}[{{ .Labels.severity }}] {{ .Labels.alertname }}: {{ .Annotations.summary }} ({{ .Status }})
          {{ end }}
